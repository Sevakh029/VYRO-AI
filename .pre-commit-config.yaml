repos:
  - repo: local
    hooks:
      - id: block-sensitive-files
        name: block env database and large result files
        entry: python -c "import pathlib,sys; bad=[p for p in sys.argv[1:] if pathlib.PurePath(p).name in {'env','.env'} or pathlib.PurePath(p).suffix in {'.db','.sqlite','.sqlite3'} or 'experiments/results' in p or 'results' in pathlib.PurePath(p).parts]; sys.exit('blocked files: ' + ', '.join(bad) if bad else 0)"
        language: system
        pass_filenames: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
