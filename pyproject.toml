[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vyro-controller"
version = "0.1.0"
description = "Pure-Python traffic control library for the VYRO prototype"
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
core = []
backend = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=12",
    "pydantic>=2.9",
    "paho-mqtt>=2.1",
]
sim = [
    "sumolib>=1.24",
    "traci>=1.24",
    "pyproj>=3.6",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["controller/src", "backend/src"]

[tool.pyright]
extraPaths = ["controller/src", "backend/src"]

[tool.pytest.ini_options]
testpaths = ["controller/tests", "backend/tests", "sim/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

