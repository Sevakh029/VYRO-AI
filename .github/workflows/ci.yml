name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check controller/src controller/tests backend/src backend/tests simulation
      - name: Integration health and schema contracts
        run: python -m pytest backend/tests/test_health.py backend/tests/test_schemas.py backend/tests/test_command_bus.py backend/tests/test_preemption.py backend/tests/test_websocket_broadcast.py
